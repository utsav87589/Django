{% extends 'base.html' %}

{% block content %}

<div class="card text-center">
    {% for post in posts %}
  <div class="card-body">
    <h5 class="card-title">{{ post.title }}</h5>
    <p class="card-text">{{ post.content[:40] }}</p>
    <a href="#" class="btn btn-primary">Read more</a>
  </div>
  {% endfor %}
</div>

{% endblock %}
