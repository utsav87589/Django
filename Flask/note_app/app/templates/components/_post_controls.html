<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Manage My Posts</h2>
        <div class="btn-group" role="group">
            <a href="{{ url_for('posts.add_posts') }}" class="btn btn-success">New Post</a>
        </div>
    </div>

    <div class="row">
        {% for post in posts %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column justify-content-between">
                    
                    <!-- Box A: Text -->
                    <div>
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text text-muted small">{{ post.content[:60] }}...</p>
                    </div>

                    <!-- Box B: Buttons (at the bottom) -->
                    <div class="btn-group mt-3">
                        <a href="#" class="btn btn-sm btn-outline-primary">View</a>
                        <a href="{{ url_for('posts.edit_post', post_id = post.id) }}" class="btn btn-sm btn-outline-warning">Edit</a>
                        <a href="#" class="btn btn-sm btn-outline-danger">Delete</a>
                    </div>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
