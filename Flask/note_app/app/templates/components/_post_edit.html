<div class="mb-3">

  <label for="post_title" class="form-label">Post title</label>
  <input type="text" class="form-control" id = "post_title" name="post_title" value = '{{ post.title }}'>

</div>

<div class="mb-3">

  <label for="post_content" class="form-label">Post content</label>
  <textarea class="form-control" id="post_content" rows="3" name="post_content">{{ post.content }}</textarea>

</div>

<div class="d-flex justify-content-center gap-3">

    <div class="form-check">
    <input class="form-check-input" type="radio" name="status" id="post_public" {{ 'checked' if post.is_public }} value="public">
    <label class="form-check-label" for="post_public">
      Public
    </label>
  </div>

  <div class="form-check">
    <input class="form-check-input" type="radio" name="status" id="post_private" {{ 'checked' if not post.is_public }} value="private">
    <label class="form-check-label" for="post_private">
      Private
    </label>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>

</div>
