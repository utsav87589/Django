{% macro post_view(title="Nothing to show sorry!", content=none, post_id = none) %}

<div class="card text-center mb-3">
  <div class="card-body">
    
    <h5 class="card-title">{{ title }}</h5>
    
    {% if content %}
      <p class="card-text">{{ content }}</p>
    {% endif %}

    {% if post_id %}
      <a href="{{ url_for('posts.view_posts', post_id=post_id) }}" class="btn btn-primary">Read more</a>
    {% endif %}
  </div>
</div>

{% endmacro %}
