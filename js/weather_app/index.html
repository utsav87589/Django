<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form class="weatherForm">
        <input class="cityInput" type="text" placeholder="Enter city name">
        <button class="submitFormButton"type="submit">Submit</button>
    </form>

    <div class="displayCard">
        <h1 class="displayCity">Atlanta</h1>
        <p class="displayTemp">22°C</p>
        <p class="displayHumidity">40%</p>
        <p class="displayDesc">Sunny 😎</p>
    </div>

    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
