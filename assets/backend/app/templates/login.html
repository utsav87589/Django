<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <h2>Login Page</h2>
    <form method="post">
        <label for="username">Username</label><br>
        <input type="text" placeholder="enter username" id="login-username" name="username"><br>

        <label for="password">Password</label><br>
        <input type="password" placeholder="enter password" id="login-password" name="password"><br>

        <button type="submit">Enter</button>
    </form>
</body>
</html>
