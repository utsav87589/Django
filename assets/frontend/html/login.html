<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <form id="login-form" class="auth-form">
        <div class="form-group">
            <label for="login-user-input">Username</label>
            <input type="text" id="login-user-input" name="username" class="form-input" placeholder="Username" required>
        </div>

        <div class="form-group">
            <label for="login-pass-input">Password</label>
            <input type="password" id="login-pass-input" name="password" class="form-input" placeholder="Password" required>
        </div>

        <button type="submit" class="submit-btn">Enter</button>
    </form>

    <script src="../js/main.js"></script>
</body>
</html>
