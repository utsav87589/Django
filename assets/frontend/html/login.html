<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <form id="login-form" class="auth-form">

        <label for="login-username">Username</label>
        <input type="text" id="login-username" class="username" name="login-username" placeholder="Enter your username" required>
        <br>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="password" name="login-password" placeholder="Enter your password" required>
        <br>

        <button type ="submit" id="login-submit-btn" class="submit-btn">Submit</button>

    </form><br>

    <a href="register.html" id="register-page-link">Doesn't have a account?Register here</a>

    <script src="../js/main.js"></script>
</body>
</html>
