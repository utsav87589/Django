<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    
    <form id="register-form" class="auth-form">

        <label for="register">Username</label>
        <input type="text" id="register-username" class="username" name="register-username" placeholder="Enter your username" required>
        <br>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" class="password" name="register-password" placeholder="Enter your password" required>
        <br>

        <button type="submit"id="register-submit-btn" class="submit-btn">Submit</button>

    </form>

    <script src="../js/main.js"></script>
</body>
</html>
